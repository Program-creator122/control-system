
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closed Loop Controller Game</title>
  <style>
    body { margin:0; overflow:hidden; background:#0f172a; }
    #game { display:block; }
    .controls {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      display:flex; gap:10px;
    }
    .btn {
      width:60px; height:60px; background:#3b82f6; color:#fff;
      font-size:24px; border:none; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      user-select:none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="controls">
    <button class="btn" id="left">◀</button>
    <button class="btn" id="up">▲</button>
    <button class="btn" id="down">▼</button>
    <button class="btn" id="right">▶</button>
  </div>

  <script>
  'use strict';

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener("resize", resize);

  const player1 = { x:100, y:200, size:40, speed:7, color:"#22c55e" };
  const player2 = { x:400, y:200, size:40, speed:7, color:"#3b82f6" };

  let Kp=0.3, Ki=0.02, Kd=0.1;
  let errorPrevX=0, errorPrevY=0, integralX=0, integralY=0;
  const errorHistory=[];

  const keys={};

  // Touch controls
  function bindButton(id,key){
    const btn=document.getElementById(id);
    btn.addEventListener("touchstart",()=>keys[key]=true);
    btn.addEventListener("touchend",()=>keys[key]=false);
  }
  bindButton("up","ArrowUp");
  bindButton("down","ArrowDown");
  bindButton("left","ArrowLeft");
  bindButton("right","ArrowRight");

  function getKeyboardInput(){
    let x=0,y=0;
    if(keys["ArrowUp"]) y=-1;
    if(keys["ArrowDown"]) y=1;
    if(keys["ArrowLeft"]) x=-1;
    if(keys["ArrowRight"]) x=1;
    return {x,y};
  }

  function feedForwardControl() {
    const k=getKeyboardInput();
    player1.x += k.x*player1.speed;
    player1.y += k.y*player1.speed;
  }

  function feedbackControl() {
    const errorX=player1.x-player2.x;
    const errorY=player1.y-player2.y;
    integralX+=errorX; integralY+=errorY;
    const derivativeX=errorX-errorPrevX;
    const derivativeY=errorY-errorPrevY;
    errorPrevX=errorX; errorPrevY=errorY;
    player2.x += Kp*errorX+Ki*integralX+Kd*derivativeX;
    player2.y += Kp*errorY+Ki*integralY+Kd*derivativeY;
    errorHistory.push(Math.sqrt(errorX**2+errorY**2));
    if(errorHistory.length>200) errorHistory.shift();
  }

  function update(){ feedForwardControl(); feedbackControl(); }

  function drawBackground(){
    const gradient=ctx.createLinearGradient(0,0,0,canvas.height);
    gradient.addColorStop(0,"#0f172a");
    gradient.addColorStop(1,"#8a1e1e");
    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  function drawGraph(){
    const graphWidth=300, graphHeight=100;
    const x0=canvas.width-graphWidth-20;
    const y0=canvas.height-graphHeight-20;
    ctx.fillStyle="rgba(255,255,255,0.8)";
    ctx.fillRect(x0,y0,graphWidth,graphHeight);
    ctx.strokeStyle="#e11d48"; ctx.beginPath();
    errorHistory.forEach((val,i)=>{
      const x=x0+i*(graphWidth/errorHistory.length);
      const y=y0+graphHeight-(val/200)*graphHeight;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.fillStyle="#111"; ctx.font="12px Segoe UI";
    ctx.fillText("Error vs Time",x0+8,y0+16);
  }

  function draw(){
    drawBackground();
    ctx.fillStyle=player1.color;
    ctx.fillRect(player1.x,player1.y,player1.size,player1.size);
    ctx.fillStyle=player2.color;
    ctx.fillRect(player2.x,player2.y,player2.size,player2.size);
    drawGraph();
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  loop();
  </script>
</body>
</html>
